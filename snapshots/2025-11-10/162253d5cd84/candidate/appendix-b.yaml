chapter:
  id: mtr-appendix-b
  chapter: Appendix B
  en: Time Limits
  zh: 时间限制
  groups:
  - id: mtr-appendix-b-g001
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b001
      en: The required minimum time limit for any match is 40 minutes.
      zh: 对局最少时间限制规定为40分钟。
  - id: mtr-appendix-b-g002
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b002
      en: 'The following time limits are recommended for each round of a tournament:'
      zh: 以下是比赛中每一局对局的建议时间限制：
  - id: mtr-appendix-b-g003
    type: list
    blocks:
    - id: mtr-appendix-b-b003
      en: '* Constructed and Limited tournaments—50 minutes'
      zh: '* 构组赛及限制赛～50分钟'
  - id: mtr-appendix-b-g004
    type: list
    blocks:
    - id: mtr-appendix-b-b004
      en: '* Single-elimination quarterfinal or semifinal matches—90 minutes'
      zh: '* 单淘汰的四分之一决赛或半决赛～90分钟'
  - id: mtr-appendix-b-g005
    type: list
    blocks:
    - id: mtr-appendix-b-b005
      en: '* Single-elimination final matches—no time limit'
      zh: '* 单淘汰决赛～无时间限制'
  - id: mtr-appendix-b-g006
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b006
      en: 'The following additional time limits are recommended for Limited tournaments:'
      zh: 以下是限制赛中的建议时间限制：
  - id: mtr-appendix-b-g007
    type: list
    blocks:
    - id: mtr-appendix-b-b007
      en: |-
        * Sealed Deck—20 minutes for deck registration and 30 minutes for deck construction. For Prereleases and Sealed Deck events that take place on the weekend of a new set release, 15 additional minutes for deck construction is recommended.
      zh: |-
        * 现开～套牌登记20分钟，套牌构组30分钟。对于在新系列发售当周周末举办的现开赛事，建议多增加15分钟套牌构组时间。对于在新系列发售当周周末举办的售前和现开赛事，建议多增加15分钟套牌构组时间。
  - id: mtr-appendix-b-g008
    type: list
    blocks:
    - id: mtr-appendix-b-b008
      en: '* Draft—25 minutes for deck registration and construction.'
      zh: '* 轮抽～套牌登记及构组共25分钟'
  - id: mtr-appendix-b-g009
    type: list
    blocks:
    - id: mtr-appendix-b-b009
      en: |-
        * Team Sealed Deck—20 minutes for deck registration and 60 minutes for deck construction. For Team-format Sealed Deck events that take place on the weekend of a new set release, 15 additional minutes for deck construction is recommended.
      zh: '* 团队现开～套牌登记20分钟，套牌构组60分钟。对于在新系列发售当周周末举办的现开赛事，建议多增加15分钟套牌构组时间。'
  - id: mtr-appendix-b-g010
    type: list
    blocks:
    - id: mtr-appendix-b-b010
      en: '* Team Draft—40 minutes for deck construction and registration.'
      zh: '* 团队轮抽～套牌构组及登记共40分钟'
  - id: mtr-appendix-b-g011
    type: list
    blocks:
    - id: mtr-appendix-b-b011
      en: |-
        * Two-Headed Giant Sealed Deck—20 minutes for deck registration and 60 minutes for deck construction. For Two-headed Giant Sealed Deck events that take place on the weekend of a new set release, 15 additional minutes for deck construction is recommended.
      zh: '* 双头巨人现开～套牌登记20分钟，套牌构组60分钟。对于在新系列发售当周周末举办的现开赛事，建议多增加15分钟套牌构组时间。'
  - id: mtr-appendix-b-g012
    type: list
    blocks:
    - id: mtr-appendix-b-b012
      en: '* Two-Headed Giant Draft—40 minutes for deck construction and registration'
      zh: '* 双头巨人轮抽～套牌构组及登记共40分钟'
  - id: mtr-appendix-b-g013
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b013
      en: |-
        The Head Judge of the tournament is the final authority on time limits for a tournament. However, any deviation from these recommendations must be announced prior to and during tournament registration.
      zh: 主审对比赛中的时间限制有最终决定权。如果比赛所使用的时间限制与这些建议有异，则须在比赛登记报名之前及进行报名登记时进行宣告。
  - id: mtr-appendix-b-g014
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b014
      en: |-
        Magic Premier Tournaments may have different time limits. These time limits can be found in the tournament or tournament series fact sheet.
      zh: 万智牌重要比赛的时间限制可能会与上述不同。这些不同的时间限制可以在该场比赛或该系列比赛的说明资料上面找到。
  - id: mtr-appendix-b-g015
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b015
      en: |-
        In timed rounds, players must wait for the officially tracked time to begin before starting their match.
      zh: 在计时进行的局次中，牌手必须等待正式计时开始之后再开始进行各自的对局。
  - id: mtr-appendix-b-g016
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b016
      en: Booster Draft Timing
      zh: 补充包轮抽的时间限制
  - id: mtr-appendix-b-g017
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b017
      en: 'Individual Booster Drafts have the following default time limits for each pick:'
      zh: 进行个人补充包轮抽时，每一次选牌的默认时间限制如下表所示：
  - id: mtr-appendix-b-g018
    type: table
    blocks:
    - id: mtr-appendix-b-b018
      en: |-
        | Cards remaining in pack | Time allotted |
        | --- | --- |
        | 15 cards | 40 seconds |
        | 14 cards | 40 seconds |
        | 13 cards | 35 seconds |
        | 12 cards | 30 seconds |
        | 11 cards | 25 seconds |
        | 10 cards | 25 seconds |
        | 9 cards | 20 seconds |
        | 8 cards | 20 seconds |
        | 7 cards | 15 seconds |
        | 6 cards | 10 seconds |
        | 5 cards | 10 seconds |
        | 4 cards | 5 seconds |
        | 3 cards | 5 seconds |
        | 2 cards | 5 seconds |
        | 1 card | N/A |
      zh: |-
        |补充包剩余牌张数量|可使用时间|
        |-----|-----|
        |15张牌|40秒|
        |14张牌|40秒|
        |13张牌|35秒|
        |12张牌|30秒|
        |11张牌|25秒|
        |10张牌|25秒|
        |9张牌|20秒|
        |8张牌|20秒|
        |7张牌|15秒|
        |6张牌|10秒|
        |5张牌|10秒|
        |4张牌|5秒|
        |3张牌|5秒|
        |2张牌|5秒|
        |1张牌|无|
  - id: mtr-appendix-b-g019
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b019
      en: |-
        The time for review after the first booster pack is 60 seconds. Each subsequent review period increases by 30 seconds.
      zh: 第一包补充包之后供检视的时间为60秒。之后每次检视之时限增加30秒。
  - id: mtr-appendix-b-g020
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b020
      en: Rochester Draft Timing
      zh: 罗彻斯特轮抽的时间限制
  - id: mtr-appendix-b-g021
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b021
      en: |-
        The review period for a booster after it has been laid out on the table and before the first card is drafted is 20 seconds. Players have 5 seconds for each pick.
      zh: 在每包补充包被放在桌面上之后，到选取第一张牌之前，有20秒的检视时间。牌手各有5秒钟的时候来进行每次的选牌。
  - id: mtr-appendix-b-g022
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b022
      en: Two-Headed Giant Draft Timing
      zh: 双头巨人轮抽的时间限制
  - id: mtr-appendix-b-g023
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b023
      en: |-
        Two-Headed Giant Booster Drafts have the following default time limits for each pick:
      zh: 在双头巨人补充包轮抽中，每一次选牌的默认时间限制如下表所示：
  - id: mtr-appendix-b-g024
    type: table
    blocks:
    - id: mtr-appendix-b-b024
      en: |-
        | Cards remaining in pack |  |  |
        | --- | --- | --- |
        | 15-Card Booster | 14-Card Booster | Time allotted |
        | 15 | 14 | 50 seconds |
        | 13 | 12 | 45 seconds |
        | 11 | 10 | 40 seconds |
        | 9 | 8 | 30 seconds |
        | 7 | 6 | 20 seconds |
        | 5 | 4 | 10 seconds |
        | 3 | - | 5 seconds |
        | 1 | 2 | N/A |
      zh: |-
        |补充包剩余牌张数量|补充包剩余牌张数量|补充包剩余牌张数量|
        |-----|-----|-----|
        |15张牌的补充包|14张牌的补充包|可使用时间|
        |15|14|50秒|
        |13|12|45秒|
        |11|10|40秒|
        |9|8|30秒|
        |7|6|20秒|
        |5|4|10秒|
        |3|-|5秒|
        |1|2|无|
  - id: mtr-appendix-b-g025
    type: paragraph
    blocks:
    - id: mtr-appendix-b-b025
      en: |-
        In addition, players receive 60 seconds to review their drafted cards in between booster packs.
      zh: 此外，在两包补充包之间，牌手们有60秒的时间来检视自己已选择的牌。
