    |4（仅限团队/2HG）|2局单淘汰对局（无瑞士轮）|无（进行单淘汰）|
    |5-8|3局单淘汰对局（无瑞士式对局）|无（进行单淘汰）|
    |9-16|4（若为限制赛制，且决胜局采补充包轮抽）<br>5（其他赛制）|8强（若为限制赛制，且决胜局采补充包轮抽）<br>4强（其他赛制）|
    |17-32|5|8强|
    |33-64|6|8强|
