name: Check official MTR update

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reference-mtr-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference-pipeline
    env:
      GH_TOKEN: ${{ github.token }}
      MTR_MANIFEST: translations/current/manifest.yaml
      MTR_STATE: official/official-source.yaml
      MTR_SNAPSHOT_ROOT: snapshots
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: reference-pipeline/pyproject.toml
      - name: Install the reference project
        run: python -m pip install -e ".[dev]"
      - name: Check the official source
        run: >-
          mtr-reference prepare-update
          --state "$MTR_STATE"
          --manifest "$MTR_MANIFEST"
          --snapshot-root "$MTR_SNAPSHOT_ROOT"
          | tee update-result.json
      - name: Read the result
        id: update
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          result = json.loads(Path("update-result.json").read_text(encoding="utf-8"))
          print(f"changed={str(result['changed']).lower()}")
          print(f"effective_date={result['effectiveDate']}")
          print(f"branch={result.get('branch', '')}")
          PY
      - name: Prepare candidate branch
        if: steps.update.outputs.changed == 'true'
        env:
          EFFECTIVE_DATE: ${{ steps.update.outputs.effective_date }}
          UPDATE_BRANCH: ${{ steps.update.outputs.branch }}
        run: |
          if gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq 'length > 0' | grep -q true; then
            echo "An open update PR already exists for $UPDATE_BRANCH"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add "$MTR_STATE" "$(dirname "$MTR_STATE")/official.json" "$MTR_SNAPSHOT_ROOT"
          git commit -m "Detect official MTR ${EFFECTIVE_DATE} update"
          git push --set-upstream origin "$UPDATE_BRANCH"
          gh pr create \
            --draft \
            --base "$DEFAULT_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --title "MTR ${EFFECTIVE_DATE} official update (translation review required)" \
            --body "Review the snapshot comparison report and candidate YAML. Correct the target translation and annotations, validate, and build before merging."
