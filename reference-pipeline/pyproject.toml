[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mtr-reference-pipeline"
version = "0.1.0"
description = "Forkable reference pipeline for parsing and translating the Magic Tournament Rules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "pdfplumber>=0.11,<1",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
mtr-reference = "mtr_reference.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mtr_reference*"]
