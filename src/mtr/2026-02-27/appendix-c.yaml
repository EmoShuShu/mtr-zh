chapter:
  id: mtr-appendix-c
  chapter: Appendix C
  en: Tiebreaker Explanation
  zh: 平分处理释疑
  groups:
  - id: mtr-appendix-c-g001
    type: markdown
    blocks:
    - id: mtr-appendix-c-b001
      en: '**Match Points**'
      zh: '**局分**'
  - id: mtr-appendix-c-g002
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b002
      en: |-
        Players earn 3 match points for each match win, 0 points for each match loss and 1 match point for each match ending in a draw. Players receiving byes are considered to have won the match.
      zh: 牌手每赢得一局对局便获得3个局分，输了得0分，平手得1分。获得轮空的牌手视作赢得了该局对局。
  - id: mtr-appendix-c-g003
    type: list
    blocks:
    - id: mtr-appendix-c-b003
      en: |-
        * A player's record is 6–2–0 (Wins–Losses–Draws). That player has 18 match points (6*3, 2*0, 0*1).
      zh: '* 若牌手成绩为6-2-0（胜-负-平）。该牌手的局分便为18分（6*3，2*0，0*1）。'
  - id: mtr-appendix-c-g004
    type: list
    blocks:
    - id: mtr-appendix-c-b004
      en: '* A player''s record is 4–2–2. That player has 14 match points (4*3, 2*0, 2*1).'
      zh: '* 若牌手的比赛成绩为4-2-2。该牌手的局分为14分（4*3，2*0，2*1）。'
  - id: mtr-appendix-c-g005
    type: markdown
    blocks:
    - id: mtr-appendix-c-b005
      en: '**Game Points**'
      zh: '**盘分**'
  - id: mtr-appendix-c-g006
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b006
      en: |-
        Game points are similar to match points in that players earn 3 game points for each game they win and 1 point for each game that ends in a draw, and 0 points for any game lost. Unfinished games are considered draws. Unplayed games are worth 0 points.
      zh: 盘分与局分类似，牌手每赢得一盘游戏便获得3个盘分，平手得1分，输了得0分。未进行完的游戏视作平局。未进行的游戏算0分。
  - id: mtr-appendix-c-g007
    type: list
    blocks:
    - id: mtr-appendix-c-b007
      en: |-
        * A player wins a match 2–0–0, so they earn 6 game points and their opponent receives 0 game points from the match.
      zh: '* 若牌手以2-0-0赢得了一局对局，则在该局中，她获得了6个盘分，而对手获得了0个盘分。'
  - id: mtr-appendix-c-g008
    type: list
    blocks:
    - id: mtr-appendix-c-b008
      en: |-
        * A player wins a match 2–1–0, so they earn 6 game points and their opponent earns 3 game points from the match.
      zh: '* 若牌手以2-1-0赢得了一局对局，则在该局中，她获得了6个盘分，而对手获得了3个盘分。'
  - id: mtr-appendix-c-g009
    type: list
    blocks:
    - id: mtr-appendix-c-b009
      en: |-
        * A player wins a match 2–0–1, so they earn 7 game points and their opponent earns 1 game point from the match.
      zh: '* 若牌手以2-0-1赢得了一局对局，则在该局中，他获得了7个盘分，而对手获得了1个盘分。'
  - id: mtr-appendix-c-g010
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b010
      en: |-
        Game points are not used in team tournaments; only the overall result of the match is used for tiebreakers.
      zh: '团队赛中不使用盘分。仅使用对局总成绩作为决胜方式。'
  - id: mtr-appendix-c-g011
    type: markdown
    blocks:
    - id: mtr-appendix-c-b011
      en: '**Match-win percentage**'
      zh: '**局胜率**'
  - id: mtr-appendix-c-g012
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b012
      en: |-
        A player’s match-win percentage is that player’s accumulated match points divided by the total match points possible in those rounds (generally, 3 times the number of rounds played). If this number is lower than 0.33, use 0.33 instead. The minimum match-win percentage of 0.33 limits the effect low performances have when calculating and comparing opponents’ match-win percentage.
      zh: |-
        牌手的局胜率计算公式如下：用牌手的总对局积分除以在该些对局中所能够获得的总局分（通常为3乘以所进行过的对局数），取所得结果与0.33之间较大者。规定0.33此最低局胜率值有助于降低表现欠佳的牌手对于其对手局胜率计算及比较方面的影响。
  - id: mtr-appendix-c-g013
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b013
      en: 'Examples:'
      zh: 示例：
  - id: mtr-appendix-c-g014
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b014
      en: |-
        These three players competed in an 8-round tournament, although only the first player completed all rounds.
      zh: 在一场共有八局的比赛当中，三位牌手的成绩如下表所示，只有第一位牌手参加了所有局次的比赛：
  - id: mtr-appendix-c-g015
    type: table
    blocks:
    - id: mtr-appendix-c-b015
      en: |-
        | Tournament<br>Record | Match Points | Rounds Played | Match-win<br>Percentage |
        | --- | --- | --- | --- |
        | 5-2-1 | 16 | 8 | 16/(8*3) = 0.667 |
        | 1-3-0, then<br>withdraws | 3 | 4 | 3/(4*3) = 0.25, so<br>0.33 is used. |
        | 3-2-0, including a<br>first-round bye, then<br>withdraws | 9 | 5 | 9/(5*3) = 0.60 |
      zh: "|比赛成绩|局分|进行过的局数|局胜率|\n|-----|-----|-----|-----|\n|5-2-1|16|8|16/(8*3) = 0.667|\n|1-3-0，后退出比赛|3|4\t|3/(4*3) = 0.25，因此使用0.33|\n|3-2-0，其中包括首局的轮空，之后退出比赛|9|5|9/(5*3) = 0.60|"
  - id: mtr-appendix-c-g016
    type: markdown
    blocks:
    - id: mtr-appendix-c-b016
      en: '**Game-win percentage**'
      zh: '**盘胜率**'
  - id: mtr-appendix-c-g017
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b017
      en: |-
        Similar to the match-win percentage, a player’s game-win percentage is the total number of game points they earned divided by the total game points possible (generally, 3 times the number of games played). Again, use 0.33 if the actual game-win percentage is lower than that.
      zh: |-
        与局胜率的计算方法类似，牌手的局胜率计算方法如下：用牌手获得的总盘分除以可能获得的总盘分（通常为3乘以与该牌手进行过的盘数）。同样的，若实际计算出来的盘胜率低于0.33，则改为使用0.33。
  - id: mtr-appendix-c-g018
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b018
      en: 'These two players competed in a four-round tournament:'
      zh: 在一场共有四局的比赛中，两位牌手游戏成绩如下表所示：
  - id: mtr-appendix-c-g019
    type: table
    blocks:
    - id: mtr-appendix-c-b019
      en: |-
        | Game Record by Match | Game Points | Games<br>Played | Game-win<br>Percentage |
        | --- | --- | --- | --- |
        | • Round 1: 2 wins (6 game points)<br>• Round 2: 2 wins and 1 loss (6 game points)<br>• Round 3: 1 win and 2 losses (3 game points)<br>• Round 4: 2 wins (6 game points) | 21 | 10 | 21/(3*10) = 0.70 |
        | • Round 1: 1 win and 2 losses (3 game points)<br>• Round 2: 1 win and 2 losses (3 game points)<br>• Round 3: 2 losses (0 game points)<br>• Round 4: 1 win and 2 losses (3 game points) | 9 | 11 | 9/(3*11) = 0.27, so<br>0.33 is used. |
      zh: |-
        |每局游戏成绩|盘分|进行过的盘数|盘胜率|
        |-----|-----|-----|-----|
        |第一局：2胜（6个盘分）<br>第二局：2胜1负（6个盘分）<br>第三局：1胜2负（3个盘分）<br>第四局：2胜（6个盘分）|21|10|21/(3*10) = 0.70|
        |第一局：1胜2负（3个盘分）<br> 第二局：1胜2负（3个盘分）<br> 第三局：2负（0个盘分）<br> 第四局：1胜2负（3个盘分）|9|11|9/(3*11) = 0.27，因此使用0.33|
  - id: mtr-appendix-c-g020
    type: markdown
    blocks:
    - id: mtr-appendix-c-b020
      en: '**Opponents’ match-win percentage**'
      zh: '**对手局胜率**'
  - id: mtr-appendix-c-g021
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b021
      en: |-
        A player’s opponents’ match-win percentage is the average match-win percentage of each opponent that player faced (ignoring those rounds for which the player received a bye). Use the match-win percentage definition listed above when calculating each individual opponent’s match-win percentage.
      zh: 牌手的对手局胜率为该牌手所较量过的对手之局胜率的平均值（不计该牌手获得轮空的轮数）。每位对手的局胜率均系根据前述定义之局胜率计算方式进行计算。
  - id: mtr-appendix-c-g022
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b022
      en: 'Examples:'
      zh: 示例：
  - id: mtr-appendix-c-g023
    type: list
    blocks:
    - id: mtr-appendix-c-b023
      en: |-
        * A player’s record in an eight-round tournament is 6–2–0. Her opponents’ match records were: 4–4–0, 7–1–0, 1–3–1, 3–3–1, 6–2–0, 5–2–1, 4–3–1, and 6–1–1, so her opponents’ match-win percentage is:
      zh: |-
        * 某牌手在一场八轮的比赛中的成绩为6-2-0。她的对手的对局成绩分别为：4-4-0，7-1-0，1-3-1，3-3-1，6-2-0，5-2-1，4-3-1，及6-1-1，因此，她的对手局胜率为：
  - id: mtr-appendix-c-g024
    type: image
    blocks:
    - id: mtr-appendix-c-b024
      asset: assets/formulas/opponents-match-win-fractions.png
      alt:
        en: Sum of eight opponents’ match-win fractions divided by eight
        zh: 八位对手局胜率分数之和除以八
  - id: mtr-appendix-c-g025
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b025
      en: 'Translated to the decimal system, this equation is:'
      zh: 转换为小数表示，可得：
  - id: mtr-appendix-c-g026
    type: image
    blocks:
    - id: mtr-appendix-c-b026
      asset: assets/formulas/opponents-match-win-decimals-eight.png
      alt:
        en: Eight opponents’ match-win percentages expressed as decimals
        zh: 八位对手的局胜率转换为小数后的计算式
  - id: mtr-appendix-c-g027
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b027
      en: |-
        With the individual match-win percentages added together, this equation becomes:
      zh: 将个人的局胜率相加，可得：
  - id: mtr-appendix-c-g028
    type: image
    blocks:
    - id: mtr-appendix-c-b028
      asset: assets/formulas/opponents-match-win-result-eight.png
      alt:
        en: 4.94 divided by 8
        zh: 4.94除以8
  - id: mtr-appendix-c-g029
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b029
      en: This player’s opponents’ match-win percentage is 0.62.
      zh: 该牌手的对手局胜率为0.62。
  - id: mtr-appendix-c-g030
    type: list
    blocks:
    - id: mtr-appendix-c-b030
      en: |-
        * Another player’s record at the same tournament was 6–2–0. His opponents’ records were: bye, 7–1–0, 1–3–1, 3–3–1, 6–2–0, 5–2–1, 4–3–1, and 6–1–1, so his opponents’ match-win percentage is:
      zh: |-
        * 在同一场比赛中，另一位牌手的成绩为6-2-0。他的对手的成绩依次为：轮空，7-1-0，1-3-1，3-3-1，6-2-0，5-2-1，4-3-1，及6-1-1，因此，他的对手的局胜率为：
  - id: mtr-appendix-c-g031
    type: image
    blocks:
    - id: mtr-appendix-c-b031
      asset: assets/formulas/opponents-match-win-decimals-seven.png
      alt:
        en: Seven opponents’ match-win percentages expressed as decimals
        zh: 七位对手的局胜率转换为小数后的计算式
  - id: mtr-appendix-c-g032
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b032
      en: |-
        With the individual match-win percentages added together, this equation becomes:
      zh: 将个人的局胜率相加，该公式变为：
  - id: mtr-appendix-c-g033
    type: image
    blocks:
    - id: mtr-appendix-c-b033
      asset: assets/formulas/opponents-match-win-result-seven.png
      alt:
        en: 4.44 divided by 7
        zh: 4.44除以7
  - id: mtr-appendix-c-g034
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b034
      en: This player’s opponents’ match-win percentage is 0.63.
      zh: 该牌手的对手局胜率为0.63。
  - id: mtr-appendix-c-g035
    type: markdown
    blocks:
    - id: mtr-appendix-c-b035
      en: '**Opponents’ game-win percentages**'
      zh: '**对手盘胜率**'
  - id: mtr-appendix-c-g036
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b036
      en: |-
        Similar to opponents’ match-win percentage, a player’s opponents’ game-win percentage is simply the average game-win percentage of all that player’s opponents. And, as with opponents’ match-win percentage, each opponent has a minimum game-win percentage of 0.33.
      zh: 与对手局胜率类似，牌手的对手盘胜率即是该牌手所有对手的盘胜率之平均值。并且，与计算对手局胜率时的处理相同，每位对手盘胜率的最小值为0.33。
  - id: mtr-appendix-c-g037
    type: markdown
    blocks:
    - id: mtr-appendix-c-b037
      en: '**Byes**'
      zh: '**轮空**'
  - id: mtr-appendix-c-g038
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b038
      en: |-
        When a player is assigned a bye for a round, they are considered to have won the match 2–0.
      zh: 当一位牌手获得某一局的轮空时，视作该牌手以2-0赢得了该轮游戏。
  - id: mtr-appendix-c-g039
    type: paragraph
    blocks:
    - id: mtr-appendix-c-b039
      en: |-
        Thus, that player earns 3 match points and 6 game points. A player’s byes are ignored when computing their opponents’ match-win and opponents’ game-win percentages.
      zh: 因此，该牌手获得3个对局积分和6个游戏积分。牌手获得轮空的局次不参与该牌手之对手局胜率及对手盘胜率的计算。
