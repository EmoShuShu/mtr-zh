chapter:
  id: mtr-appendix-d
  chapter: Appendix D
  en: Recommended Play Booster Mix for Limited Tournaments
  zh: 限制赛中推荐的补充包构成
  groups:
  - id: mtr-appendix-d-g001
    type: paragraph
    blocks:
    - id: mtr-appendix-d-b001
      en: |-
        Note: The following play boosters mixes are required for Premier Play tournaments.
      zh: 注：重要赛事比赛必须使用下列的补充包构成。
  - id: mtr-appendix-d-g002
    type: paragraph
    blocks:
    - id: mtr-appendix-d-b002
      en: |-
        For *Secrets of Strixhaven*, the recommended play booster mix for Limited tournaments is (effective April 17, 2026)
      zh: '在*斯翠海文的秘密*的限制赛中，推荐使用的常规补充包构成如下（2026年4月17日起）：'
  - id: mtr-appendix-d-g003
    type: list
    blocks:
    - id: mtr-appendix-d-b003
      en: '* Individual Sealed Deck – 6 *Secrets of Strixhaven* (per player)'
      zh: '* 个人现开赛～6包*斯翠海文的秘密*（每位牌手）'
  - id: mtr-appendix-d-g004
    type: list
    blocks:
    - id: mtr-appendix-d-b004
      en: |-
        * Individual Booster Draft or Team Rochester Draft – 3 *Secrets of Strixhaven* (per player)
      zh: '* 个人补充包轮抽赛或团队罗彻斯特轮抽赛～3包*斯翠海文的秘密*（每位牌手）'
  - id: mtr-appendix-d-g005
    type: list
    blocks:
    - id: mtr-appendix-d-b005
      en: '* Three-Person Team Sealed – 12 *Secrets of Strixhaven* (per team)'
      zh: '* 三人团队现开赛～12包*斯翠海文的秘密*（每支队伍）'
  - id: mtr-appendix-d-g006
    type: list
    blocks:
    - id: mtr-appendix-d-b006
      en: '* Two-Headed Giant Sealed Deck – 8 *Secrets of Strixhaven* (per team)'
      zh: '* 双头巨人现开赛～8包*斯翠海文的秘密*（每支队伍）'
  - id: mtr-appendix-d-g007
    type: list
    blocks:
    - id: mtr-appendix-d-b007
      en: '* Two-Headed Giant Booster Draft – 6 *Secrets of Strixhaven* (per team)'
      zh: '* 双头巨人补充包轮抽赛～6包*斯翠海文的秘密*（每支队伍）'
  - id: mtr-appendix-d-g008
    type: paragraph
    blocks:
    - id: mtr-appendix-d-b008
      en: |-
        For *Magic: The Gathering | Teenage Mutant Ninja Turtles*, the recommended play booster mix for Limited tournaments is (effective, February 27, 2026 through April 16, 2026):
      zh: '在*万智牌 | 忍者神龟*的限制赛中，推荐使用的常规补充包构成如下（2026年2月27日起至2026年4月16日）：'
  - id: mtr-appendix-d-g009
    type: list
    blocks:
    - id: mtr-appendix-d-b009
      en: |-
        * Individual Sealed Deck – 6 *Magic: The Gathering | Teenage Mutant Ninja Turtles* (per player)
      zh: '* 个人现开赛～6包*万智牌 | 忍者神龟*（每位牌手）'
  - id: mtr-appendix-d-g010
    type: list
    blocks:
    - id: mtr-appendix-d-b010
      en: |-
        * Individual Booster Draft or Team Rochester Draft – 3 *Magic: The Gathering | Teenage Mutant Ninja Turtles* (per player)
      zh: '* 个人补充包轮抽赛或团队罗彻斯特轮抽赛～3包*万智牌 | 忍者神龟*（每位牌手）'
  - id: mtr-appendix-d-g011
    type: list
    blocks:
    - id: mtr-appendix-d-b011
      en: |-
        * Three-Person Team Sealed – 12 *Magic: The Gathering | Teenage Mutant Ninja Turtles* (per team)
      zh: '* 三人团队现开赛～12包*万智牌 | 忍者神龟*（每支队伍）'
  - id: mtr-appendix-d-g012
    type: list
    blocks:
    - id: mtr-appendix-d-b012
      en: |-
        * Two-Headed Giant Sealed Deck – 8 *Magic: The Gathering | Teenage Mutant Ninja Turtles* (per team)
      zh: '* 双头巨人现开赛～8包*万智牌 | 忍者神龟*（每支队伍）'
  - id: mtr-appendix-d-g013
    type: list
    blocks:
    - id: mtr-appendix-d-b013
      en: |-
        * Two-Headed Giant Booster Draft – 6 *Magic: The Gathering | Teenage Mutant Ninja Turtles* (per team)
      zh: '* 双头巨人补充包轮抽赛～6包*万智牌 | 忍者神龟*（每支队伍）'
  - id: mtr-appendix-d-g014
    type: paragraph
    blocks:
    - id: mtr-appendix-d-b014
      en: |-
        For *Lorwyn Eclipsed*, the recommended play booster mix for Limited tournaments is (effective January 16, 2026 through April 16, 2026):
      zh: '在*洛温：暗影笼罩*的限制赛中，推荐使用的常规补充包构成如下（2026年1月16日起至2026年4月16日）：'
  - id: mtr-appendix-d-g015
    type: list
    blocks:
    - id: mtr-appendix-d-b015
      en: '* Individual Sealed Deck – 6 *Lorwyn Eclipsed* (per player)'
      zh: '* 个人现开赛～6包*洛温：暗影笼罩*（每位牌手）'
  - id: mtr-appendix-d-g016
    type: list
    blocks:
    - id: mtr-appendix-d-b016
      en: |-
        * Individual Booster Draft or Team Rochester Draft – 3 *Lorwyn Eclipsed* (per player)
      zh: '* 个人补充包轮抽赛或团队罗彻斯特轮抽赛～3包*洛温：暗影笼罩*（每位牌手）'
  - id: mtr-appendix-d-g017
    type: list
    blocks:
    - id: mtr-appendix-d-b017
