      zh: '* 三人团队现开赛～12包*洛温：暗影笼罩*（每支队伍）'
  - id: mtr-appendix-d-g018
    type: list
    blocks:
    - id: mtr-appendix-d-b018
      en: '* Two-Headed Giant Sealed Deck – 8 *Lorwyn Eclipsed* (per team)'
      zh: '* 双头巨人现开赛～8包*洛温：暗影笼罩*（每支队伍）'
  - id: mtr-appendix-d-g019
    type: list
    blocks:
    - id: mtr-appendix-d-b019
      en: '* Two-Headed Giant Booster Draft – 6 *Lorwyn Eclipsed* (per team)'
      zh: '* 双头巨人补充包轮抽赛～6包*洛温：暗影笼罩*（每支队伍）'
