chapter:
  id: mtr-appendix-d
  chapter: Appendix D
  en: Recommended Play Booster Mix for Limited Tournaments
  zh: 限制赛中推荐的补充包构成
  groups:
  - id: mtr-appendix-d-g001
    type: paragraph
    blocks:
    - id: mtr-appendix-d-b001
      en: |-
        Note: The following play boosters mixes are required for Premier Play tournaments.
      zh: 注：重要赛事比赛必须使用下列的补充包构成。
  - id: mtr-appendix-d-g002
    type: paragraph
    blocks:
    - id: mtr-appendix-d-b002
      en: |-
        For Lorwyn Eclipsed, the recommended play booster mix for Limited tournaments is (effective January 16, 2026):
      zh: ''
  - id: mtr-appendix-d-g003
    type: list
    blocks:
    - id: mtr-appendix-d-b003
      en: '* Individual Sealed Deck – 6 Lorwyn Eclipsed (per player)'
      zh: ''
  - id: mtr-appendix-d-g004
    type: list
    blocks:
    - id: mtr-appendix-d-b004
      en: |-
        * Individual Booster Draft or Team Rochester Draft – 3 Lorwyn Eclipsed (per player)
      zh: ''
  - id: mtr-appendix-d-g005
    type: list
    blocks:
    - id: mtr-appendix-d-b005
      en: '* Three-Person Team Sealed – 12 Lorwyn Eclipsed (per team)'
      zh: ''
  - id: mtr-appendix-d-g006
    type: list
    blocks:
    - id: mtr-appendix-d-b006
      en: '* Two-Headed Giant Sealed Deck – 8 Lorwyn Eclipsed (per team)'
      zh: ''
  - id: mtr-appendix-d-g007
    type: list
    blocks:
    - id: mtr-appendix-d-b007
      en: '* Two-Headed Giant Booster Draft – 6 Lorwyn Eclipsed (per team)'
      zh: ''
  - id: mtr-appendix-d-g008
    type: paragraph
    blocks:
    - id: mtr-appendix-d-b008
      en: |-
        For Magic: The Gathering | Avatar: The Last Airbender, the recommended play booster mix for Limited tournaments is (effective November 14, 2025):
      zh: 在*万智牌 | 降世神通：最后的气宗*的限制赛中，推荐使用的常规补充包构成如下（2025年11月14日起）：
  - id: mtr-appendix-d-g009
    type: list
    blocks:
    - id: mtr-appendix-d-b009
      en: |-
        * Individual Sealed Deck – 6 Magic: The Gathering | Avatar: The Last Airbender (per player)
      zh: '* 个人现开赛～6包*万智牌 | 降世神通：最后的气宗*（每位牌手）'
  - id: mtr-appendix-d-g010
    type: list
    blocks:
    - id: mtr-appendix-d-b010
      en: |-
        * Individual Booster Draft or Team Rochester Draft – 3 Magic: The Gathering | Avatar: The Last Airbender (per player)
      zh: '* 个人补充包轮抽赛或团队罗彻斯特轮抽赛～3包*万智牌 | 降世神通：最后的气宗*（每位牌手）'
  - id: mtr-appendix-d-g011
    type: list
    blocks:
    - id: mtr-appendix-d-b011
      en: |-
        * Three-Person Team Sealed – 12 Magic: The Gathering | Avatar: The Last Airbender (per team)
      zh: '* 三人团队现开赛～12包*万智牌 | 降世神通：最后的气宗*（每支队伍）'
  - id: mtr-appendix-d-g012
    type: list
    blocks:
    - id: mtr-appendix-d-b012
      en: |-
        * Two-Headed Giant Sealed Deck – 8 Magic: The Gathering | Avatar: The Last Airbender (per team)
      zh: '* 双头巨人现开赛～8包*万智牌 | 降世神通：最后的气宗*（每支队伍）'
  - id: mtr-appendix-d-g013
    type: list
    blocks:
    - id: mtr-appendix-d-b013
      en: |-
        * Two-Headed Giant Booster Draft – 6 Magic: The Gathering | Avatar: The Last Airbender (per team)
      zh: '* 双头巨人补充包轮抽赛～6包*万智牌 | 降世神通：最后的气宗*（每支队伍）'
  - id: mtr-appendix-d-g014
    type: paragraph
    blocks:
    - id: mtr-appendix-d-b014
      en: |-
        For Magic: The Gathering | Marvel’s Spider-Man, the recommended play booster mix for Limited tournaments is (effective September 19, 2025 to November 13, 2025):
      zh: 在*万智牌 | 漫威的蜘蛛侠*的限制赛中，推荐使用的常规补充包构成如下（2025年9月19日起至2025年11月13日）：
