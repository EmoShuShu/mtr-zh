chapter:
  id: mtr-appendix-b
  chapter: "Appendix B"
  en: "Time Limits"
  zh: "时间限制"
  groups:
    - id: mtr-appendix-b-g001
      type: paragraph
      blocks:
        - id: mtr-appendix-b-b001
          en: |-
            Individual Booster Drafts have the following default time limits for each pick:
          zh: |-
            进行个人补充包轮抽时，每一次选牌的默认时间限制如下表所示：

    - id: mtr-appendix-b-g002
      type: table
      blocks:
        - id: mtr-appendix-b-b002
          en: |-
            | Cards remaining in pack | Time allotted |
            |---|---|
            | 15 cards | 40 seconds |
            | 10 cards | 25 seconds |
            | 5 cards | 10 seconds |
            | 1 card | N/A |
          zh: |-
            | 补充包剩余牌张数量 | 可使用时间 |
            |---|---|
            | 15张牌 | 40秒 |
            | 10张牌 | 25秒 |
            | 5张牌 | 10秒 |
            | 1张牌 | 无 |

