name: Validate language-neutral reference pipeline

on:
  pull_request:
    paths:
      - "reference-pipeline/**"
      - ".github/workflows/reference-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference-pipeline
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: reference-pipeline/pyproject.toml

      - name: Install isolated reference project
        run: python -m pip install -e ".[dev]"

      - name: Run isolated reference tests
        run: python -m pytest

      - name: Validate and build the German example
        run: |
          mtr-reference validate examples/de-DE/manifest.yaml
          mtr-reference build examples/de-DE/manifest.yaml \
            --json-out build/de-DE.json \
            --markdown-out build/de-DE.md
