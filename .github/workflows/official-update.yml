name: Check official MTR update

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      retry_closed:
        description: "重新打开已关闭的同一更新 PR（默认暂缓）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: official-mtr-update
  cancel-in-progress: false

jobs:
  check:
    name: Detect official PDF and open review PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Detect and prepare official update
        run: >-
          python scripts/check_official_update.py
          --project-root .
          --result tmp/official-update-result.json
          --diagnostics-dir tmp/official-update-diagnostics

      - name: Read update result
        id: update
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("tmp/official-update-result.json").read_text(encoding="utf-8"))
          for key in ("changed", "effectiveDate", "pdfSha256", "branch", "report"):
              value = result.get(key, "")
              if isinstance(value, bool):
                  value = str(value).lower()
              print(f"{key}={value}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              from mtr_pipeline.maintenance_report import official_summary
              summary.write(official_summary(result["maintenance"]))
          PY

      - name: Report unchanged official PDF
        if: steps.update.outputs.changed != 'true'
        run: echo "Official MTR PDF is unchanged."

      - name: Check for an existing review pull request
        id: existing
        if: steps.update.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: ${{ steps.update.outputs.branch }}
          RETRY_CLOSED: ${{ inputs.retry_closed || false }}
        run: python -m mtr_pipeline.update_pr --branch "$UPDATE_BRANCH"

      - name: Commit generated snapshot and candidate
        if: steps.update.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          UPDATE_BRANCH: ${{ steps.update.outputs.branch }}
          EFFECTIVE_DATE: ${{ steps.update.outputs.effectiveDate }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add snapshots
          git commit -m "检测到官方 MTR $EFFECTIVE_DATE 更新"
          git push --set-upstream origin "$UPDATE_BRANCH"

      - name: Create draft review pull request
        if: steps.update.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          UPDATE_BRANCH: ${{ steps.update.outputs.branch }}
          EFFECTIVE_DATE: ${{ steps.update.outputs.effectiveDate }}
          PDF_SHA256: ${{ steps.update.outputs.pdfSha256 }}
          REPORT_PATH: ${{ steps.update.outputs.report }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          report = os.environ["REPORT_PATH"]
          body = f"""## 官方 MTR 更新候选

          - 生效日期：`{os.environ['EFFECTIVE_DATE']}`
          - PDF SHA-256：`{os.environ['PDF_SHA256']}`
          - 审计报告：[`{report}`](../blob/{os.environ['UPDATE_BRANCH']}/{report})

          此 PR 只保存快照和候选证据，保持 Draft 状态，不切换当前版本。候选英文来自新官方 PDF；中文和注解继承后仍需审校。

          合并前请完成：

          - [ ] 阅读英文差异和全部 error/warning findings
          - [ ] 运行 `scripts/promote_official_update.py --snapshot <快照目录>` 预览，加 `--apply` 确认切换
          - [ ] 用审校助手第 1 项接入新版本；旧工程会在确认后完整归档
          - [ ] 校对所有继承的中文，补齐空白翻译
          - [ ] 必要时修正解析或对齐逻辑并重新生成候选
          - [ ] 更新版本说明
          - [ ] 重新生成 `dist/rules.json` 和 `dist/MTR.md`
          - [ ] 确认 `Validate and build current release` 全部通过
          - [ ] 将 PR 标记为 Ready for review 后人工合并
          """
          Path("tmp/official-update-pr.md").write_text(body, encoding="utf-8")
          PY
          gh pr create \
            --draft \
            --base master \
            --head "$UPDATE_BRANCH" \
            --assignee "$REPOSITORY_OWNER" \
            --title "MTR $EFFECTIVE_DATE 官方更新（待人工校对）" \
            --body-file tmp/official-update-pr.md

      - name: Upload official update diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mtr-official-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/official-update-diagnostics/
            tmp/official-update-result.json
          if-no-files-found: warn
          retention-days: 30
