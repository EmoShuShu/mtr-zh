name: Publish MTR release

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release.yml"
      - "dist/rules.json"
      - "dist/MTR.md"
      - "src/mtr/current-version.txt"
      - "src/mtr/version-notes.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mtr-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Resolve current release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < src/mtr/current-version.txt)"
          if [[ ! "$version" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid current MTR version: $version" >&2
            exit 1
          fi
          manifest="src/mtr/$version/manifest.yaml"
          if [[ ! -f "$manifest" ]]; then
            echo "Current MTR manifest does not exist: $manifest" >&2
            exit 1
          fi
          echo "MTR_VERSION=$version" >> "$GITHUB_ENV"
          echo "MTR_MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: Strictly validate source
        run: >-
          python scripts/validate.py
          --manifest "$MTR_MANIFEST"
          --schema schema/mtr-source.schema.json
          --project-root .

      - name: Run tests
        run: python -m pytest

      - name: Build release assets
        run: >-
          python scripts/build.py
          --manifest "$MTR_MANIFEST"
          --schema schema/mtr-source.schema.json
          --output-schema schema/mtr-output.schema.json
          --project-root .
          --json-out release-artifacts/rules.json
          --markdown-out release-artifacts/MTR.md

      - name: Validate and compare release assets
        shell: bash
        run: |
          python scripts/validate_output.py \
            --input release-artifacts/rules.json \
            --schema schema/mtr-output.schema.json
          cmp release-artifacts/rules.json dist/rules.json
          cmp release-artifacts/MTR.md dist/MTR.md
          cd release-artifacts
          sha256sum rules.json MTR.md > SHA256SUMS

      - name: Resolve deterministic release tag
        id: metadata
        shell: bash
        run: |
          rules_sha="$(sha256sum release-artifacts/rules.json | cut -d' ' -f1)"
          tag="mtr-${MTR_VERSION}-${rules_sha:0:12}"
          echo "rules_sha=$rules_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        env:
          RULES_SHA: ${{ steps.metadata.outputs.rules_sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          text = f"""# MTR 中文版 {os.environ['MTR_VERSION']}

          本 Release 在受保护的 `master` 分支合并后自动生成。

          - `rules.json`：网站使用的单文件 JSON 产物
          - `MTR.md`：便于阅读和审阅的 Markdown 产物
          - `SHA256SUMS`：附件完整性校验值
          - `rules.json` SHA-256：`{os.environ['RULES_SHA']}`
          - 来源提交：`{os.environ['GITHUB_SHA']}`
          """
          Path("release-artifacts/RELEASE_NOTES.md").write_text(text, encoding="utf-8")
          PY

      - name: Create or verify GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$RELEASE_TAG" \
              --dir existing-release \
              --pattern rules.json \
              --pattern MTR.md \
              --pattern SHA256SUMS
            cmp release-artifacts/rules.json existing-release/rules.json
            cmp release-artifacts/MTR.md existing-release/MTR.md
            cmp release-artifacts/SHA256SUMS existing-release/SHA256SUMS
            echo "Release already exists with identical assets: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              release-artifacts/rules.json \
              release-artifacts/MTR.md \
              release-artifacts/SHA256SUMS \
              --latest \
              --target "$GITHUB_SHA" \
              --title "MTR 中文版 $MTR_VERSION" \
              --notes-file release-artifacts/RELEASE_NOTES.md
          fi
