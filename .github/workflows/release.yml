name: Publish MTR release

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release.yml"
      - "mtr_pipeline/github_release.py"
      - "scripts/release.py"
      - "dist/rules.json"
      - "dist/MTR.md"
      - "src/mtr/current-version.txt"
      - "src/mtr/version-notes.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mtr-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release assets
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Resolve current release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < src/mtr/current-version.txt)"
          if [[ ! "$version" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid current MTR version: $version" >&2
            exit 1
          fi
          manifest="src/mtr/$version/manifest.yaml"
          if [[ ! -f "$manifest" ]]; then
            echo "Current MTR manifest does not exist: $manifest" >&2
            exit 1
          fi
          echo "MTR_VERSION=$version" >> "$GITHUB_ENV"
          echo "MTR_MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: Strictly validate source
        run: >-
          python scripts/validate.py
          --manifest "$MTR_MANIFEST"
          --schema schema/mtr-source.schema.json
          --project-root . --require-reviewed

      - name: Run tests
        run: python -m pytest --junitxml=outputs/release-tests.xml

      - name: Build release assets
        run: >-
          python scripts/build.py --profile release
          --manifest "$MTR_MANIFEST"
          --schema schema/mtr-source.schema.json
          --output-schema schema/mtr-output.schema.json
          --project-root .
          --json-out outputs/release-artifacts/rules.json
          --markdown-out outputs/release-artifacts/MTR.md

      - name: Validate and compare release assets
        shell: bash
        run: |
          python scripts/validate_output.py \
            --input outputs/release-artifacts/rules.json \
            --schema schema/mtr-output.schema.json
          cmp outputs/release-artifacts/rules.json dist/rules.json
          cmp outputs/release-artifacts/MTR.md dist/MTR.md
          cd outputs/release-artifacts
          sha256sum rules.json MTR.md > SHA256SUMS

      - name: Create or verify GitHub Release
        run: >-
          python scripts/release.py --artifacts outputs/release-artifacts
          --source-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --publish

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mtr-release-${{ github.sha }}
          path: |
            outputs/release-artifacts/
            outputs/release-tests.xml
          if-no-files-found: warn
          retention-days: 14
