[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mtr-zh-pipeline"
version = "0.1.0"
description = "Schema and deterministic builders for the Chinese Magic Tournament Rules"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "pdfplumber>=0.11,<1",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
mtr-build = "mtr_pipeline.build:main"
mtr-import-legacy = "mtr_pipeline.legacy_import:main"
mtr-migrate-legacy = "mtr_pipeline.legacy_migrate:main"
mtr-snapshot = "mtr_pipeline.snapshot:main"
mtr-check-official-update = "mtr_pipeline.official_update:main"
mtr-validate = "mtr_pipeline.validate:main"
mtr-validate-output = "mtr_pipeline.output_validate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["mtr_pipeline*"]
